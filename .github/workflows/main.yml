name: Python CI

on:
  push:
    branches: [ "main", "develop" ]  # Добавляем develop ветку для тестирования
    paths-ignore:  # Игнорируем изменения в README и документации
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]  # Тестируем на нескольких версиях Python

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'  # Включаем кэширование pip
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Используем файл зависимостей
        pip install pytest pytest-cov coverage PyQt5
    
    - name: Run tests with coverage
      run: |
        pytest -v --cov=src --cov-report=xml tests/  # Явно указываем src и tests директории
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: python-${{ matrix.python-version }}
        fail_ci_if_error: true  # Не даст пройти CI если не удалось загрузить отчет
    
    - name: Notify on failure
      if: failure()  # Отправляем уведомление при ошибке
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: "❌ Тесты не пройдены! Пожалуйста, проверьте ошибки в GitHub Actions."
          })
