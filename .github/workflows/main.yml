name: Run Python Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 
        sudo apt-get install -y libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
        sudo apt-get install -y libxcb-shape0 libxcb-util1
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest PyQt5 pytest-qt
        
    - name: Run tests with Xvfb
      run: |
        xvfb-run -s "-screen 0 1024x768x24" pytest tests/
      env:
        QT_DEBUG_PLUGINS: 1
        DISPLAY: ":99"
