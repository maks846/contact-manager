name: Run Python Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest PyQt5 pytest-qt
        
    - name: Run tests with Xvfb
      run: |
        xvfb-run -a pytest tests/
